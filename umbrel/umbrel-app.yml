manifestVersion: 1
id: lunaticoin-umbrelanalyser
category: developer-tools
name: Umbrel Analyser
version: "0.0.5"
tagline: Track CPU, RAM, disk and network of every Umbrel app
description: >-
  Umbrel Analyser samples resource consumption of every container running on your
  Umbrel and stores it locally so you can study how each app behaves over time.

  Built for the classic question: "how much does electrs use while it's indexing,
  versus when it's idle?" — but it works for any app.

  Features:

  - Auto-discovers every container, no per-app config
  - Samples CPU, RAM, disk I/O, real data-dir size and network usage
  - Configurable polling interval and retention
  - Per-app history charts with selectable time ranges (1h, 6h, 24h, 7d, 30d)
  - Export raw samples and disk-size series as CSV or JSON for offline analysis

  All data lives on your Umbrel — nothing leaves the device.
releaseNotes: >-
  v0.0.5:
  - New Analysis ON/OFF toggle in the header (top right). Switching to OFF
    pauses all data collection (CPU/RAM/disk-IO and disk-size loops both
    skip work) while keeping the UI, historical data and exports alive.
    State is persisted and applies on next tick.
  - Fix: disk-size data was never recorded. The docker SDK v7.x doesn't
    accept `size=True` in `inspect_container()`, so every per-container
    inspect was failing silently. Now we use `client.df()` which returns
    SizeRw, SizeRootFs and Mounts for every container in a single call.
